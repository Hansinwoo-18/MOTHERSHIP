<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MOTHERSHIP - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>MOTHERSHIP</h1>

    <input
        type="text"
        id="loginUsername"
        placeholder="USERNAME"
        autocomplete="username"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="PASSWORD"
        autocomplete="current-password"
    >

    <button
        type="button"
        id="loginButton"
    >
        LOGIN
    </button>

    <div
        id="loginMessage"
        style="
            margin-top:15px;
            min-height:20px;
            color:#888;
            font-size:10px;
            letter-spacing:2px;
            text-align:center;
        "
    ></div>

    <p style="
        margin-top:20px;
        font-size:10px;
        letter-spacing:2px;
        color:#555;
        text-align:center;
    ">
        NEW OPERATOR?
        <a href="register.html">
            REGISTER
        </a>
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
